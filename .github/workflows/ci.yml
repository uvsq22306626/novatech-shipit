name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, api-gateway, paie, conges, recrutement]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        working-directory: services/${{ matrix.service }}
        run: npm install
      - name: Vérifier la syntaxe
        working-directory: services/${{ matrix.service }}
        run: node --check src/index.js
      - name: Lancer les tests
        working-directory: services/${{ matrix.service }}
        run: npm run test --if-present
      - name: Couverture de tests
        working-directory: services/${{ matrix.service }}
        run: npm run test:coverage --if-present

  security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, api-gateway, paie, conges, recrutement]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit des dépendances
        working-directory: services/${{ matrix.service }}
        run: npm audit --audit-level=high || true
      - name: Construire l'image Docker
        run: docker build -t ${{ matrix.service }}-service:scan services/${{ matrix.service }}
      - name: Scan de l'image avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}-service:scan
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
    health-check-render:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: [build, security]
    runs-on: ubuntu-latest
    steps:
      - name: Attendre que Render termine le déploiement
        run: sleep 90

      - name: Vérifier l'API Gateway
        run: |
          curl -sf https://novatech-shipit-api-gateway-dev-4xk1.onrender.com/health \
            || (echo "❌ api-gateway ne répond pas" && exit 1)

      - name: Vérifier le service Auth
        run: |
          curl -sf https://novatech-shipit-auth-dev-4xk1.onrender.com/health \
            || echo "⚠️ auth ne répond pas (pas bloquant si pas de /health défini)"

      - name: Vérifier le frontend
        run: |
          curl -sf https://novatech-shipit-frontend-dev-4xk1.onrender.com \
            || (echo "❌ frontend ne répond pas" && exit 1)
