name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, api-gateway, paie, conges, recrutement]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        working-directory: services/${{ matrix.service }}
        run: npm install

      - name: Vérifier la syntaxe
        working-directory: services/${{ matrix.service }}
        run: node --check src/index.js

      - name: Lancer les tests
        working-directory: services/${{ matrix.service }}
        run: npm test --if-present

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit des dépendances (auth)
        working-directory: services/auth
        run: npm audit --audit-level=high || true

      - name: Construire l'image Docker (auth)
        run: docker build -t auth-service:scan services/auth

      - name: Scan de l'image avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: auth-service:scan
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
