global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'paie'
    static_configs:
      - targets: ['paie:3002']
    metrics_path: '/metrics'

  - job_name: 'auth'
    static_configs:
      - targets: ['auth:3001']
    metrics_path: '/metrics'

  - job_name: 'conges'
    static_configs:
      - targets: ['conges:3003']
    metrics_path: '/metrics'

  - job_name: 'recrutement'
    static_configs:
      - targets: ['recrutement:3004']
    metrics_path: '/metrics'

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']
    metrics_path: '/metrics'
