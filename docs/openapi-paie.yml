openapi: 3.0.3
info:
  title: NovaTech HRFlow — Service Paie
  description: |
    API du microservice de calcul de paie (`services/paie`).
    Expose le calcul des bulletins de paie, les heures supplémentaires
    et les métriques Prometheus.
  version: 1.1.0
  contact:
    name: NovaTech HRFlow
servers:
  - url: http://localhost:3002
    description: Environnement local
  - url: https://api.novatech-hrflow.internal/paie
    description: Environnement de production (via API Gateway)

tags:
  - name: Santé
    description: Health check et métriques
  - name: Paie
    description: Calcul de la paie

paths:
  /health:
    get:
      tags: [Santé]
      summary: Vérifie l'état du service
      description: Utilisé par les health checks ECS (`healthCheck.command`) et par Prometheus (`up{job="paie"}`).
      operationId: getHealth
      responses:
        "200":
          description: Le service répond normalement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: paie

  /metrics:
    get:
      tags: [Santé]
      summary: Métriques Prometheus
      description: "Expose les métriques au format texte Prometheus (`prom-client`) : métriques par défaut préfixées `paie_`, `http_request_duration_seconds`, `http_requests_total`, et `paie_virement_echecs_total`."
      operationId: getMetrics
      responses:
        "200":
          description: Métriques au format d'exposition Prometheus.
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP http_requests_total Nombre total de requêtes HTTP
                # TYPE http_requests_total counter
                http_requests_total{method="GET",route="/health",status="200"} 42

  /paie/calculer:
    post:
      tags: [Paie]
      summary: Calcule le bulletin de paie d'un employé
      description: |
        Calcule le brut, les cotisations salariales/patronales et le net pour un employé,
        puis déclenche un virement Stripe. Le bulletin est enregistré en base (`bulletins_paie`)
        que le virement réussisse ou non — son statut est reporté dans `virementStatut` /
        `virementErreur`, et la réponse HTTP passe à `502` si le virement a échoué.

        Un seul bulletin peut exister par couple `(employeeId, mois, annee)` : un appel
        répété sur une période déjà calculée renvoie `409` sans redéclencher de virement.
      operationId: calculerPaie
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculerPaieRequest"
            example:
              employeeId: 42
              mois: 8
              annee: 2026
      responses:
        "200":
          description: Bulletin de paie calculé, enregistré, et virement Stripe réussi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bulletin"
              example:
                employeeId: 42
                mois: 8
                annee: 2026
                brut: 3200
                cotisationsSalariales: 704
                cotisationsPatronales: 1344
                net: 2496
                virementStatut: reussi
                virementErreur: null
                generatedAt: "2026-08-20T09:15:00.000Z"
        "400":
          description: "`employeeId`, `mois` ou `annee` invalides."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "mois/annee invalides"
        "401":
          description: Token JWT manquant ou invalide.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "No token"
        "404":
          description: Employé introuvable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Employee not found
        "409":
          description: Un bulletin existe déjà pour cette période ; aucun nouveau virement n'est déclenché.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictResponse"
              example:
                error: "Bulletin déjà généré pour cette période"
                bulletin:
                  employeeId: 42
                  mois: 8
                  annee: 2026
                  net: 2496
        "500":
          description: Erreur serveur (base de données injoignable, requête invalide, etc.).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "connect ECONNREFUSED 127.0.0.1:5432"
        "502":
          description: Bulletin enregistré mais le virement Stripe a échoué (voir `virementErreur`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bulletin"
              example:
                employeeId: 42
                mois: 8
                annee: 2026
                brut: 3200
                cotisationsSalariales: 704
                cotisationsPatronales: 1344
                net: 2496
                virementStatut: echoue
                virementErreur: "Stripe timeout"
                generatedAt: "2026-08-20T09:15:00.000Z"

  /paie/heures-sup:
    post:
      tags: [Paie]
      summary: Calcule la majoration pour heures supplémentaires
      description: Calcule le taux horaire à partir du salaire mensuel brut (base 151,67h) et applique une majoration de 25 %.
      operationId: calculerHeuresSup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeuresSupRequest"
            example:
              employeeId: 42
              heures: 10
      responses:
        "200":
          description: Majoration calculée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeuresSupResponse"
              example:
                heures: 10
                tauxHoraire: 21.1
                majorationHeuresSup: 263.75
                total: 263.75
        "400":
          description: "`employeeId` ou `heures` invalides."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "heures invalides"
        "401":
          description: Token JWT manquant ou invalide.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "No token"
        "404":
          description: Employé introuvable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Employee not found
        "500":
          description: Erreur serveur.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "connect ECONNREFUSED 127.0.0.1:5432"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT signé avec le secret partagé (`JWT_SECRET`). Vérifié directement par
        le service paie (et non plus seulement par l'API Gateway en amont).

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: paie
      required: [status, service]

    CalculerPaieRequest:
      type: object
      properties:
        employeeId:
          type: integer
          minimum: 1
          example: 42
        mois:
          type: integer
          minimum: 1
          maximum: 12
          example: 8
        annee:
          type: integer
          minimum: 2000
          maximum: 2100
          example: 2026
      required: [employeeId, mois, annee]

    Bulletin:
      type: object
      properties:
        employeeId:
          type: integer
          example: 42
        mois:
          type: integer
          example: 8
        annee:
          type: integer
          example: 2026
        brut:
          type: number
          format: float
          description: Salaire mensuel brut de l'employé.
          example: 3200
        cotisationsSalariales:
          type: number
          format: float
          description: 22 % du brut.
          example: 704
        cotisationsPatronales:
          type: number
          format: float
          description: 42 % du brut.
          example: 1344
        net:
          type: number
          format: float
          description: Brut moins cotisations salariales.
          example: 2496
        virementStatut:
          type: string
          enum: [reussi, echoue]
          description: Statut du virement Stripe déclenché lors du calcul.
          example: reussi
        virementErreur:
          type: string
          nullable: true
          description: Message d'erreur Stripe si `virementStatut` vaut `echoue`, sinon `null`.
          example: null
        generatedAt:
          type: string
          format: date-time
          example: "2026-08-20T09:15:00.000Z"
      required:
        - employeeId
        - mois
        - annee
        - brut
        - cotisationsSalariales
        - cotisationsPatronales
        - net
        - virementStatut
        - virementErreur
        - generatedAt

    ConflictResponse:
      type: object
      properties:
        error:
          type: string
          example: "Bulletin déjà généré pour cette période"
        bulletin:
          $ref: "#/components/schemas/Bulletin"
      required: [error, bulletin]

    HeuresSupRequest:
      type: object
      properties:
        employeeId:
          type: integer
          minimum: 1
          example: 42
        heures:
          type: number
          format: float
          exclusiveMinimum: 0
          example: 10
      required: [employeeId, heures]

    HeuresSupResponse:
      type: object
      properties:
        heures:
          type: number
          format: float
          example: 10
        tauxHoraire:
          type: number
          format: float
          description: Salaire mensuel brut divisé par 151,67.
          example: 21.1
        majorationHeuresSup:
          type: number
          format: float
          description: heures × tauxHoraire × 1.25
          example: 263.75
        total:
          type: number
          format: float
          example: 263.75
      required: [heures, tauxHoraire, majorationHeuresSup, total]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Employee not found"
      required: [error]
